<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR物理実験室 - 直線電流が作る磁場</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // 1. マーカー追従（ちらつき防止の安定化コンポーネント）
    AFRAME.registerComponent('smooth-follower', {
      schema: {
        target: {type: 'selector'},
        lerpAmount: {type: 'number', default: 0.15}
      },
      init: function() {
        this.targetWorldPos = new THREE.Vector3();
        this.targetWorldQuat = new THREE.Quaternion();
        this.el.object3D.visible = true;
      },
      tick: function () {
        if (!this.data.target) return;
        const targetEl = this.data.target;

        if (targetEl.object3D.visible) {
          targetEl.object3D.getWorldPosition(this.targetWorldPos);
          targetEl.object3D.getWorldQuaternion(this.targetWorldQuat);
          this.el.object3D.position.lerp(this.targetWorldPos, this.data.lerpAmount);
          this.el.object3D.quaternion.slerp(this.targetWorldQuat, this.data.lerpAmount);
        }
      }
    });

    // 2. 直線電流が作る磁場コンポーネント
    AFRAME.registerComponent('magnetic-field-straight', {
      schema: {
        currentVal: {type: 'number', default: 1.0}
      },
      init: function () {
        this.arrows = [];
        this.offsets = []; 
        
        // ベクトル計算用の変数
        this.bDir = new THREE.Vector3();
        this.colorObj = new THREE.Color();

        // 磁場をサンプリングする空間の定義（導線を中心とした円筒座標系）
        const radii = [0.6, 1.2]; // 導線からの距離（2重の円）
        const heights = [0.4, 1.0, 1.6]; // 高さ（3段階）
        const thetaSteps = 8; // 1周あたりの矢印の数

        heights.forEach(y => {
          radii.forEach(r => {
            for (let j = 0; j < thetaSteps; j++) {
              const theta = (Math.PI * 2) * (j / thetaSteps);
              const x = r * Math.cos(theta);
              const z = r * Math.sin(theta);
              
              // 矢印の相対位置を保存
              this.offsets.push({ x: x, y: y, z: z, r: r });
              
              // Three.jsのArrowHelperを生成（色は後で動的に変更）
              const arrow = new THREE.ArrowHelper(
                new THREE.Vector3(0,1,0), 
                new THREE.Vector3(x, y, z), 
                0.1, 0xffff00, 0.1, 0.1
              );
              this.el.object3D.add(arrow);
              this.arrows.push(arrow);
            }
          });
        });
      },

      tick: function () {
        const I = this.data.currentVal;

        // 電流が0の場合はすべての矢印を非表示にする
        if (I === 0) {
          for (let i = 0; i < this.arrows.length; i++) {
            this.arrows[i].visible = false;
          }
          return;
        }

        // 電流がある場合は計算して描画
        for (let i = 0; i < this.arrows.length; i++) {
          const arrow = this.arrows[i];
          const offset = this.offsets[i];
          
          arrow.visible = true;

          // ビオ・サバールの法則（無限直線電流）に基づく磁場の向きと大きさ
          // B ∝ (I × r)
          // 電流はY軸方向ベクトル(0, I, 0)、位置ベクトルは(x, 0, z)
          // 外積(I × r) = (I*z, 0, -I*x)
          this.bDir.set(I * offset.z, 0, -I * offset.x);
          
          // 距離に反比例する磁場の強さ B ∝ |I| / r
          const mag = Math.abs(I) / offset.r;
          
          // 矢印の長さを調整（大きすぎないようにスケーリング）
          const arrowLength = Math.min(mag * 0.3, 0.5);
          
          // 磁場の強さに応じて色を変化（強いと黄色、弱いと暗い黄色）
          const colorIntensity = Math.min(mag * 0.5, 1.0);
          this.colorObj.setHSL(0.15, 1.0, 0.2 + colorIntensity * 0.3); // 黄色系

          this.bDir.normalize();
          
          arrow.setDirection(this.bDir);
          arrow.setLength(arrowLength, arrowLength * 0.3, arrowLength * 0.3);
          arrow.setColor(this.colorObj.getHex());
        }
      }
    });

    // 3. UIの連動
    document.addEventListener('DOMContentLoaded', () => {
      const fieldEntity = document.getElementById('magnetic-field-manager');
      const currentSlider = document.getElementById('current-slider');
      const currentLabel = document.getElementById('current-label');
      
      // 電流を表すUIエフェクト用
      const wire = document.getElementById('wire-cylinder');
      const currentArrowUp = document.getElementById('current-arrow-up');
      const currentArrowDown = document.getElementById('current-arrow-down');

      currentSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        currentLabel.textContent = val.toFixed(1) + " A";
        fieldEntity.setAttribute('magnetic-field-straight', 'currentVal', val);

        // 電流の向きに応じて導線の色と中心の矢印を切り替える
        if (val > 0) {
          wire.setAttribute('color', '#FF6666'); // 上向き（正）は赤系
          currentArrowUp.setAttribute('visible', 'true');
          currentArrowDown.setAttribute('visible', 'false');
          // 電流の大きさで矢印のスケールを変える
          currentArrowUp.setAttribute('scale', `${1 + val*0.2} ${1 + val*0.2} ${1 + val*0.2}`);
        } else if (val < 0) {
          wire.setAttribute('color', '#6666FF'); // 下向き（負）は青系
          currentArrowUp.setAttribute('visible', 'false');
          currentArrowDown.setAttribute('visible', 'true');
          currentArrowDown.setAttribute('scale', `${1 - val*0.2} ${1 - val*0.2} ${1 - val*0.2}`);
        } else {
          wire.setAttribute('color', '#AAAAAA'); // ゼロはグレー
          currentArrowUp.setAttribute('visible', 'false');
          currentArrowDown.setAttribute('visible', 'false');
        }
      });
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">
  
  <!-- タイトル表示 -->
  <div style="position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none;">
    <div style="padding: 6px 12px; font-size: 14px; font-weight: bold; background-color: rgba(0, 0, 0, 0.7); color: white; border: 1px solid white; border-radius: 6px;">
      直線電流が作る磁場
    </div>
  </div>

  <!-- スライダーUI -->
  <div style="position: absolute; top: 50px; left: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; width: calc(100vw - 20px); max-width: 280px;">
    
    <!-- 電流 -->
    <div style="display: flex; align-items: center; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 8px;">
      <span style="color: white; font-weight: bold; font-size: 13px; width: 85px; white-space: nowrap;">電流 I : <span id="current-label">1.0 A</span></span>
      <input type="range" id="current-slider" min="-3.0" max="3.0" step="0.1" value="1.0" style="flex-grow: 1; margin-left: 5px;">
    </div>
    
    <!-- 説明テキスト -->
    <div style="background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px; margin-top: 5px;">
      <span style="color: #ddd; font-size: 11px;">※プラスは上向き(赤)、マイナスは下向き(青)の電流です。右ねじの法則を観察してみましょう。</span>
    </div>

  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <a-marker id="marker-0" type="barcode" value="0" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"></a-marker>

    <a-entity camera></a-entity>

    <!-- システム全体を1つのコンテナにまとめ、マーカーに追従させる -->
    <a-entity id="system-container" smooth-follower="target: #marker-0; lerpAmount: 0.15">
      
      <!-- 導線（円柱） -->
      <a-cylinder id="wire-cylinder" position="0 1.0 0" radius="0.05" height="3" color="#FF6666" opacity="0.9"></a-cylinder>
      
      <!-- 電流の向きを示す矢印（正のとき） -->
      <a-entity id="current-arrow-up" position="0 2.6 0" visible="true">
        <a-cone position="0 0 0" radius-bottom="0.15" height="0.4" color="#FF3333"></a-cone>
      </a-entity>

      <!-- 電流の向きを示す矢印（負のとき） -->
      <a-entity id="current-arrow-down" position="0 -0.6 0" visible="false" rotation="180 0 0">
        <a-cone position="0 0 0" radius-bottom="0.15" height="0.4" color="#3333FF"></a-cone>
      </a-entity>

      <!-- 磁場ベクトルを管理・描画するEntityをコンテナ内に配置（座標計算の安定化） -->
      <a-entity id="magnetic-field-manager" magnetic-field-straight="currentVal: 1.0"></a-entity>

    </a-entity>

  </a-scene>
</body>
</html>
