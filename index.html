<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR物理実験室 - 棒磁石の磁力線</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // 1. マーカー追従（猶予時間タイマー付き安定版）
    AFRAME.registerComponent('smooth-follower', {
      schema: {
        target: {type: 'selector'},
        lerpAmount: {type: 'number', default: 0.15},
        hideDelay: {type: 'number', default: 1500}
      },
      init: function() {
        this.targetWorldPos = new THREE.Vector3();
        this.targetWorldQuat = new THREE.Quaternion();
        this.el.object3D.visible = false;
        this.lostTime = null;
      },
      tick: function (time, timeDelta) {
        if (!this.data.target) return;
        const targetEl = this.data.target;

        if (targetEl.object3D.visible) {
          this.el.object3D.visible = true;
          this.lostTime = null;

          targetEl.object3D.getWorldPosition(this.targetWorldPos);
          targetEl.object3D.getWorldQuaternion(this.targetWorldQuat);
          this.el.object3D.position.lerp(this.targetWorldPos, this.data.lerpAmount);
          this.el.object3D.quaternion.slerp(this.targetWorldQuat, this.data.lerpAmount);
        } else {
          if (this.el.object3D.visible) {
            if (this.lostTime === null) {
              this.lostTime = time;
            } else {
              if (time - this.lostTime > this.data.hideDelay) {
                this.el.object3D.visible = false;
              }
            }
          }
        }
      }
    });

    // 2. 棒磁石の磁力線の計算・描画コンポーネント
    AFRAME.registerComponent('bar-magnet-field', {
      init: function () {
        this.arrows = [];
        this.offsets = []; 
        
        // 参照用のEntityを取得
        this.magnetCenter = document.getElementById('magnet-center');
        this.poleN = document.getElementById('pole-n');
        this.poleS = document.getElementById('pole-s');
        this.systemContainer = document.getElementById('system-container');

        this.posCenter = new THREE.Vector3();
        this.posN = new THREE.Vector3();
        this.posS = new THREE.Vector3();
        this.targetPos = new THREE.Vector3();
        
        this.bN = new THREE.Vector3();
        this.bS = new THREE.Vector3();
        this.bTotal = new THREE.Vector3();
        this.colorObj = new THREE.Color();

        // 磁石の中心からの相対位置で空間サンプリング（全方位）
        const rMin = 0.5, rMax = 2.2, rSteps = 4;
        const thetaSteps = 8, phiSteps = 16;

        for (let i = 0; i <= rSteps; i++) {
          const r = rMin + (rMax - rMin) * (i / rSteps);
          for (let j = 0; j <= thetaSteps; j++) {
            const theta = Math.PI * (j / thetaSteps);
            const currentPhiSteps = (j === 0 || j === thetaSteps) ? 1 : phiSteps;

            for (let k = 0; k < currentPhiSteps; k++) {
              const phi = (Math.PI * 2) * (k / currentPhiSteps);
              const x = r * Math.sin(theta) * Math.cos(phi);
              const y = r * Math.cos(theta);
              const z = r * Math.sin(theta) * Math.sin(phi);
              
              this.offsets.push(new THREE.Vector3(x, y, z));
              
              // 矢印の生成（色は水色系ベース）
              const arrow = new THREE.ArrowHelper(
                new THREE.Vector3(0,1,0), 
                new THREE.Vector3(0,0,0), 
                0.1, 0x00FFFF, 0.1, 0.1
              );
              this.el.object3D.add(arrow);
              this.arrows.push(arrow);
            }
          }
        }
      },

      tick: function () {
        // コンテナが非表示なら矢印も計算ストップ・非表示
        if (!this.systemContainer.object3D.visible) {
          this.el.object3D.visible = false;
          return;
        }
        this.el.object3D.visible = true;

        // 磁石の中心座標と、両極の座標を取得
        this.magnetCenter.object3D.getWorldPosition(this.posCenter);
        this.poleN.object3D.getWorldPosition(this.posN);
        this.poleS.object3D.getWorldPosition(this.posS);

        const m = 1.0; // 磁極の強さ（固定値）

        for (let i = 0; i < this.arrows.length; i++) {
          const arrow = this.arrows[i];
          const offset = this.offsets[i];

          // 矢印のワールド座標を決定
          this.targetPos.copy(this.posCenter).add(offset);
          this.bTotal.set(0, 0, 0);

          // N極からの磁場 (湧き出し)
          this.bN.subVectors(this.targetPos, this.posN);
          const distSqN = this.bN.lengthSq();
          if (distSqN > 0.01) {
            this.bN.normalize().multiplyScalar(m / distSqN);
            this.bTotal.add(this.bN);
          }

          // S極からの磁場 (吸い込み：マイナス)
          this.bS.subVectors(this.targetPos, this.posS);
          const distSqS = this.bS.lengthSq();
          if (distSqS > 0.01) {
            // S極へ向かうベクトルにするため引く
            this.bS.normalize().multiplyScalar(m / distSqS);
            this.bTotal.sub(this.bS);
          }

          const totalMag = this.bTotal.length();
          if (totalMag < 0.01) {
            arrow.visible = false;
            continue;
          }

          arrow.visible = true;
          
          // 磁力線の強さに応じた長さと色の計算
          const arrowLength = Math.min(totalMag * 0.3, 0.45);
          const colorIntensity = Math.min(totalMag * 0.8, 1.0);
          this.colorObj.setHSL(0.5, 1.0, 0.2 + colorIntensity * 0.4); // 水色系で明るさが変わる

          this.bTotal.normalize();
          
          arrow.position.copy(this.targetPos);
          arrow.setDirection(this.bTotal);
          arrow.setLength(arrowLength, arrowLength * 0.3, arrowLength * 0.3);
          arrow.setColor(this.colorObj.getHex());
        }
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">
  
  <!-- タイトルと説明表示（シンプル化） -->
  <div style="position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none;">
    <div style="padding: 6px 12px; font-size: 14px; font-weight: bold; background-color: rgba(0, 0, 0, 0.7); color: white; border: 1px solid white; border-radius: 6px;">
      棒磁石の磁力線
    </div>
  </div>

  <div style="position: absolute; top: 50px; left: 10px; z-index: 10; width: calc(100vw - 20px); max-width: 280px; pointer-events: none;">
    <div style="background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 6px;">
      <span style="color: #ddd; font-size: 12px;">ARマーカーの上に、1本の棒磁石とそれが空間に作り出す3Dの磁力線（双極子磁場）が表示されます。スマホを様々な角度から覗き込んで観察してみましょう。</span>
    </div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <a-marker id="marker-0" type="barcode" value="0" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"></a-marker>

    <a-entity camera></a-entity>

    <a-entity id="system-container" smooth-follower="target: #marker-0; lerpAmount: 0.15; hideDelay: 1500">
      
      <!-- 棒磁石のモデル -->
      <a-entity id="magnet-center" position="0 1.0 0">
        
        <!-- N極（右半分: Xのプラス方向） -->
        <a-box position="0.3 0 0" width="0.6" height="0.15" depth="0.15" color="#FF3333"></a-box>
        <a-text value="N" position="0.45 0.15 0" align="center" color="white" scale="0.6 0.6 0.6"></a-text>
        
        <!-- S極（左半分: Xのマイナス方向） -->
        <a-box position="-0.3 0 0" width="0.6" height="0.15" depth="0.15" color="#3333FF"></a-box>
        <a-text value="S" position="-0.45 0.15 0" align="center" color="white" scale="0.6 0.6 0.6"></a-text>

        <!-- 磁場計算の基準点となる両極の先端（透明なEntity） -->
        <a-entity id="pole-n" position="0.55 0 0"></a-entity>
        <a-entity id="pole-s" position="-0.55 0 0"></a-entity>

      </a-entity>

    </a-entity>

    <!-- 磁力線の描画マネージャー -->
    <a-entity id="magnetic-field-manager" bar-magnet-field></a-entity>

  </a-scene>
</body>
</html>
