<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR物理実験室 - 電場の重ね合わせ</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // 1. マーカー追従
    AFRAME.registerComponent('smooth-follower', {
      schema: {
        target: {type: 'selector'},
        lerpAmount: {type: 'number', default: 0.15}
      },
      init: function() {
        this.targetWorldPos = new THREE.Vector3();
        this.targetWorldQuat = new THREE.Quaternion();
        this.el.object3D.visible = false;
        this.wasVisible = false;
      },
      tick: function () {
        if (!this.data.target) return;
        const targetEl = this.data.target;
        const isVisible = targetEl.object3D.visible;

        if (isVisible) {
          this.el.object3D.visible = true;
          targetEl.object3D.getWorldPosition(this.targetWorldPos);
          targetEl.object3D.getWorldQuaternion(this.targetWorldQuat);
          
          if (!this.wasVisible) {
            this.el.object3D.position.copy(this.targetWorldPos);
            this.el.object3D.quaternion.copy(this.targetWorldQuat);
          } else {
            const distance = this.el.object3D.position.distanceTo(this.targetWorldPos);
            if (distance > 0.005) {
              this.el.object3D.position.lerp(this.targetWorldPos, this.data.lerpAmount);
              this.el.object3D.quaternion.slerp(this.targetWorldQuat, this.data.lerpAmount);
            }
          }
        } else {
          this.el.object3D.visible = false;
        }
        this.wasVisible = isVisible;
      }
    });

    // 2. 電場の重ね合わせコンポーネント (球を無くし、透明なアンカーを使用)
    AFRAME.registerComponent('superposed-field', {
      schema: {
        charge0Val: {type: 'number', default: 1.0},
        charge1Val: {type: 'number', default: -1.0}
      },
      init: function () {
        this.arrows = [];
        this.offsets = []; 
        
        this.charge0El = document.getElementById('charge0-container');
        this.charge1El = document.getElementById('charge1-container');

        // 透明な基準点（アンカー）を取得
        this.anchor0El = document.getElementById('charge0-anchor');
        this.anchor1El = document.getElementById('charge1-anchor');

        this.pos0 = new THREE.Vector3();
        this.pos1 = new THREE.Vector3();
        this.targetPos = new THREE.Vector3();
        this.e0 = new THREE.Vector3();
        this.e1 = new THREE.Vector3();
        this.eTotal = new THREE.Vector3();
        this.colorObj = new THREE.Color();

        const rMin = 0.5, rMax = 2.0, rSteps = 3;
        const thetaSteps = 6, phiSteps = 12;

        const generateOffsets = (ownerIndex) => {
          for (let i = 0; i <= rSteps; i++) {
            const r = rMin + (rMax - rMin) * (i / rSteps);
            for (let j = 0; j <= thetaSteps; j++) {
              const theta = Math.PI * (j / thetaSteps);
              const currentPhiSteps = (j === 0 || j === thetaSteps) ? 1 : phiSteps;

              for (let k = 0; k < currentPhiSteps; k++) {
                const phi = (Math.PI * 2) * (k / currentPhiSteps);
                const x = r * Math.sin(theta) * Math.cos(phi);
                const y = r * Math.cos(theta);
                const z = r * Math.sin(theta) * Math.sin(phi);
                
                this.offsets.push({ vec: new THREE.Vector3(x, y, z), owner: ownerIndex });
                
                const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 0.1, 0xffffff, 0.1, 0.1);
                this.el.object3D.add(arrow);
                this.arrows.push(arrow);
              }
            }
          }
        };

        generateOffsets(0); 
        generateOffsets(1); 
      },

      tick: function () {
        const isC0Visible = this.charge0El.object3D.visible;
        const isC1Visible = this.charge1El.object3D.visible;
        const val0 = this.data.charge0Val;
        const val1 = this.data.charge1Val;

        if (!isC0Visible && !isC1Visible) {
          this.el.object3D.visible = false;
          return;
        }
        this.el.object3D.visible = true;

        // 球の代わりに透明なアンカーの座標を取得
        if (isC0Visible) {
          this.anchor0El.object3D.getWorldPosition(this.pos0);
        }
        if (isC1Visible) {
          this.anchor1El.object3D.getWorldPosition(this.pos1);
        }

        for (let i = 0; i < this.arrows.length; i++) {
          const arrow = this.arrows[i];
          const offset = this.offsets[i];

          if ((offset.owner === 0 && (!isC0Visible || val0 === 0)) ||
              (offset.owner === 1 && (!isC1Visible || val1 === 0))) {
            arrow.visible = false;
            continue;
          }

          arrow.visible = true;
          
          const basePos = offset.owner === 0 ? this.pos0 : this.pos1;
          this.targetPos.copy(basePos).add(offset.vec);

          if (this.targetPos.y < 0) {
            arrow.visible = false;
            continue;
          }

          this.eTotal.set(0, 0, 0);

          if (isC0Visible && val0 !== 0) {
            this.e0.subVectors(this.targetPos, this.pos0);
            const distSq = this.e0.lengthSq();
            if (distSq > 0.01) {
              const mag = val0 / distSq;
              this.e0.normalize().multiplyScalar(mag);
              this.eTotal.add(this.e0);
            }
          }

          if (isC1Visible && val1 !== 0) {
            this.e1.subVectors(this.targetPos, this.pos1);
            const distSq = this.e1.lengthSq();
            if (distSq > 0.01) {
              const mag = val1 / distSq;
              this.e1.normalize().multiplyScalar(mag);
              this.eTotal.add(this.e1);
            }
          }

          const totalMag = this.eTotal.length();
          if (totalMag < 0.01) {
            arrow.visible = false;
            continue;
          }

          const arrowLength = Math.min(totalMag * 0.5, 0.4);
          const colorIntensity = Math.min(totalMag, 1.0);
          this.colorObj.setHSL((1.0 - colorIntensity) * 0.66, 1.0, 0.5);

          this.eTotal.normalize();
          
          arrow.position.copy(this.targetPos);
          arrow.setDirection(this.eTotal);
          arrow.setLength(arrowLength, arrowLength * 0.3, arrowLength * 0.3);
          arrow.setColor(this.colorObj.getHex());
        }
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const fieldEntity = document.getElementById('electric-field-manager');
      
      const updateCharge = (sliderId, labelId, attrName) => {
        const slider = document.getElementById(sliderId);
        const label = document.getElementById(labelId);

        slider.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          label.textContent = val.toFixed(1);
          fieldEntity.setAttribute('superposed-field', attrName, val);
          // ※球の色の更新処理は削除済み
        });
      };

      updateCharge('charge0-slider', 'charge0-label', 'charge0Val');
      updateCharge('charge1-slider', 'charge1-label', 'charge1Val');
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">
  
  <div style="position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; z-index: 10; pointer-events: none;">
    <div style="padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: rgba(0, 0, 0, 0.7); color: white; border: 1px solid white; border-radius: 8px;">
      電場の重ね合わせ（マーカー0 / マーカー1）
    </div>
  </div>

  <div style="position: absolute; bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 10;">
    <div style="width: 80%; max-width: 400px; display: flex; align-items: center; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 10px;">
      <span style="color: white; font-weight: bold; width: 70px;">電荷0: <span id="charge0-label">1.0</span></span>
      <input type="range" id="charge0-slider" min="-3.0" max="3.0" step="0.1" value="1.0" style="flex-grow: 1; margin-left: 10px;">
    </div>
    <div style="width: 80%; max-width: 400px; display: flex; align-items: center; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 10px;">
      <span style="color: white; font-weight: bold; width: 70px;">電荷1: <span id="charge1-label">-1.0</span></span>
      <input type="range" id="charge1-slider" min="-3.0" max="3.0" step="0.1" value="-1.0" style="flex-grow: 1; margin-left: 10px;">
    </div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <a-marker id="marker-0" type="barcode" value="0"></a-marker>
    <a-marker id="marker-1" type="barcode" value="1"></a-marker>

    <a-entity camera></a-entity>

    <a-entity id="charge0-container" smooth-follower="target: #marker-0; lerpAmount: 0.15">
      <!-- 球を削除し、透明なエンティティ(アンカー)で座標のみ確保 -->
      <a-entity id="charge0-anchor" position="0 2.5 0"></a-entity>
    </a-entity>

    <a-entity id="charge1-container" smooth-follower="target: #marker-1; lerpAmount: 0.15">
      <!-- 球を削除し、透明なエンティティ(アンカー)で座標のみ確保 -->
      <a-entity id="charge1-anchor" position="0 2.5 0"></a-entity>
    </a-entity>

    <a-entity id="electric-field-manager" superposed-field="charge0Val: 1.0; charge1Val: -1.0"></a-entity>

  </a-scene>
</body>
</html>
