<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR物理実験室 - フレミングの左手の法則</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // 1. マーカー追従（猶予時間タイマー付き安定版）
    AFRAME.registerComponent('smooth-follower', {
      schema: {
        target: {type: 'selector'},
        lerpAmount: {type: 'number', default: 0.15},
        hideDelay: {type: 'number', default: 1500}
      },
      init: function() {
        this.targetWorldPos = new THREE.Vector3();
        this.targetWorldQuat = new THREE.Quaternion();
        this.el.object3D.visible = false;
        this.lostTime = null;
      },
      tick: function (time, timeDelta) {
        if (!this.data.target) return;
        const targetEl = this.data.target;

        if (targetEl.object3D.visible) {
          this.el.object3D.visible = true;
          this.lostTime = null;

          targetEl.object3D.getWorldPosition(this.targetWorldPos);
          targetEl.object3D.getWorldQuaternion(this.targetWorldQuat);
          this.el.object3D.position.lerp(this.targetWorldPos, this.data.lerpAmount);
          this.el.object3D.quaternion.slerp(this.targetWorldQuat, this.data.lerpAmount);
        } else {
          if (this.el.object3D.visible) {
            if (this.lostTime === null) {
              this.lostTime = time;
            } else {
              if (time - this.lostTime > this.data.hideDelay) {
                this.el.object3D.visible = false;
              }
            }
          }
        }
      }
    });

    // 2. ローレンツ力（フレミングの左手）計算・描画コンポーネント
    AFRAME.registerComponent('lorentz-system', {
      schema: {
        currentVal: {type: 'number', default: 1.0},
        bFieldVal: {type: 'number', default: 1.0}
      },
      tick: function () {
        const I = this.data.currentVal;
        const B = this.data.bFieldVal;
        // 力 F = I × B に比例
        const F = I * B;

        // --- 磁石の極（N/S）の更新 ---
        const poleFront = document.getElementById('pole-front');
        const poleBack = document.getElementById('pole-back');
        const textFront = document.getElementById('text-front');
        const textBack = document.getElementById('text-back');

        if (B > 0) {
          // Bが正: 手前がN極、奥がS極 (磁場は奥に向かう)
          poleFront.setAttribute('color', '#FF3333'); textFront.setAttribute('value', 'N');
          poleBack.setAttribute('color', '#3333FF');  textBack.setAttribute('value', 'S');
        } else if (B < 0) {
          // Bが負: 手前がS極、奥がN極 (磁場は手前に向かう)
          poleFront.setAttribute('color', '#3333FF'); textFront.setAttribute('value', 'S');
          poleBack.setAttribute('color', '#FF3333');  textBack.setAttribute('value', 'N');
        } else {
          poleFront.setAttribute('color', '#888888'); textFront.setAttribute('value', '');
          poleBack.setAttribute('color', '#888888');  textBack.setAttribute('value', '');
        }

        // --- 磁場(B)ベクトルの更新（水色） ---
        const bArrows = document.getElementById('arrow-B-group');
        if (B === 0) {
          bArrows.setAttribute('visible', 'false');
        } else {
          bArrows.setAttribute('visible', 'true');
          // Bが正なら-Z方向(奥)へ、負なら+Z方向(手前)へ回転
          const rotX = B > 0 ? -90 : 90;
          bArrows.setAttribute('rotation', `${rotX} 0 0`);
          bArrows.setAttribute('scale', `1 ${Math.abs(B)*0.2 + 0.5} 1`);
        }

        // --- 電流(I)ベクトルの更新（黄色） ---
        const arrowI = document.getElementById('arrow-I');
        if (I === 0) {
          arrowI.setAttribute('visible', 'false');
        } else {
          arrowI.setAttribute('visible', 'true');
          // Iが正なら+X方向(右)へ、負なら-X方向(左)へ回転
          const rotZ = I > 0 ? -90 : 90;
          arrowI.setAttribute('rotation', `0 0 ${rotZ}`);
          arrowI.setAttribute('scale', `1 ${Math.abs(I)*0.2 + 0.5} 1`);
        }

        // --- 力(F)ベクトルの更新（緑色） ---
        const arrowF = document.getElementById('arrow-F');
        if (F === 0) {
          arrowF.setAttribute('visible', 'false');
        } else {
          arrowF.setAttribute('visible', 'true');
          // Fが正なら+Y方向(上)へ、負なら-Y方向(下)へ回転
          const rotX = F > 0 ? 0 : 180;
          arrowF.setAttribute('rotation', `${rotX} 0 0`);
          // 力は目立たせるために少し大きめにスケール
          arrowF.setAttribute('scale', `1 ${Math.abs(F)*0.2 + 0.5} 1`);
        }
      }
    });

    // 3. UIの連動
    document.addEventListener('DOMContentLoaded', () => {
      const systemEntity = document.getElementById('lorentz-manager');
      
      const currentSlider = document.getElementById('current-slider');
      const currentLabel = document.getElementById('current-label');
      
      const bfieldSlider = document.getElementById('bfield-slider');
      const bfieldLabel = document.getElementById('bfield-label');

      currentSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        currentLabel.textContent = val.toFixed(1);
        systemEntity.setAttribute('lorentz-system', 'currentVal', val);
      });

      bfieldSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        bfieldLabel.textContent = val.toFixed(1);
        systemEntity.setAttribute('lorentz-system', 'bFieldVal', val);
      });
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">
  
  <!-- タイトル表示 -->
  <div style="position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none;">
    <div style="padding: 6px 12px; font-size: 14px; font-weight: bold; background-color: rgba(0, 0, 0, 0.7); color: white; border: 1px solid white; border-radius: 6px;">
      フレミングの左手の法則
    </div>
  </div>

  <!-- スライダーUI -->
  <div style="position: absolute; top: 50px; left: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; width: calc(100vw - 20px); max-width: 280px;">
    
    <!-- 電流スライダー -->
    <div style="display: flex; align-items: center; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 8px;">
      <span style="color: yellow; font-weight: bold; font-size: 13px; width: 85px; white-space: nowrap;">電流(I): <span id="current-label">1.0</span></span>
      <input type="range" id="current-slider" min="-3.0" max="3.0" step="0.1" value="1.0" style="flex-grow: 1; margin-left: 5px;">
    </div>

    <!-- 磁場スライダー -->
    <div style="display: flex; align-items: center; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 8px;">
      <span style="color: #00FFFF; font-weight: bold; font-size: 13px; width: 85px; white-space: nowrap;">磁場(B): <span id="bfield-label">1.0</span></span>
      <input type="range" id="bfield-slider" min="-3.0" max="3.0" step="0.1" value="1.0" style="flex-grow: 1; margin-left: 5px;">
    </div>

    <!-- 説明テキスト -->
    <div style="background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px; margin-top: 5px;">
      <span style="color: #ddd; font-size: 11px;">※左手を出して、中指(黄)、人差し指(水色)、親指(緑)の向きが一致するか確認しましょう。</span>
    </div>

  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <a-marker id="marker-0" type="barcode" value="0" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"></a-marker>

    <a-entity camera></a-entity>

    <!-- AR空間のルートコンテナ -->
    <a-entity id="system-container" smooth-follower="target: #marker-0; lerpAmount: 0.15; hideDelay: 1500">
      
      <!-- 導線 (X軸方向) -->
      <a-cylinder position="0 1.0 0" radius="0.05" height="2.5" rotation="0 0 90" color="#CCCCCC" opacity="0.8"></a-cylinder>

      <!-- 磁石：手前極 (Z=+0.6) -->
      <a-box id="pole-front" position="0 1.0 0.6" width="0.8" height="0.4" depth="0.2" color="#FF3333" opacity="0.9">
        <a-text id="text-front" value="N" position="0 0.25 0" align="center" color="white" scale="0.8 0.8 0.8" rotation="-90 0 0"></a-text>
      </a-box>

      <!-- 磁石：奥極 (Z=-0.6) -->
      <a-box id="pole-back" position="0 1.0 -0.6" width="0.8" height="0.4" depth="0.2" color="#3333FF" opacity="0.9">
        <a-text id="text-back" value="S" position="0 0.25 0" align="center" color="white" scale="0.8 0.8 0.8" rotation="-90 0 0"></a-text>
      </a-box>

      <!-- ベクトル描画マネージャー -->
      <a-entity id="lorentz-manager" lorentz-system="currentVal: 1.0; bFieldVal: 1.0" position="0 1.0 0">
        
        <!-- 磁場(B)ベクトル（水色・2本並べる） -->
        <a-entity id="arrow-B-group" position="0 0 0">
          <a-entity position="-0.3 0 0">
            <a-cylinder position="0 0.3 0" radius="0.02" height="0.6" color="#00FFFF" opacity="0.7"></a-cylinder>
            <a-cone position="0 0.7 0" radius-bottom="0.08" height="0.2" color="#00FFFF" opacity="0.7"></a-cone>
          </a-entity>
          <a-entity position="0.3 0 0">
            <a-cylinder position="0 0.3 0" radius="0.02" height="0.6" color="#00FFFF" opacity="0.7"></a-cylinder>
            <a-cone position="0 0.7 0" radius-bottom="0.08" height="0.2" color="#00FFFF" opacity="0.7"></a-cone>
          </a-entity>
        </a-entity>

        <!-- 電流(I)ベクトル（黄色） -->
        <a-entity id="arrow-I" position="0 0 0">
          <!-- 導線と被らないように少し手前上部にオフセット -->
          <a-entity position="0 0.15 0.15">
            <a-cylinder position="0 0.5 0" radius="0.03" height="1.0" color="#FFFF00"></a-cylinder>
            <a-cone position="0 1.1 0" radius-bottom="0.1" height="0.25" color="#FFFF00"></a-cone>
          </a-entity>
        </a-entity>

        <!-- 力(F)ベクトル（緑色・一番太く目立たせる） -->
        <a-entity id="arrow-F" position="0 0 0">
          <a-cylinder position="0 0.5 0" radius="0.04" height="1.0" color="#00FF00"></a-cylinder>
          <a-cone position="0 1.1 0" radius-bottom="0.12" height="0.3" color="#00FF00"></a-cone>
        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>
</body>
</html>
