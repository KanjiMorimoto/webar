<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR物理実験室 - マルチマーカー版</title>
    <!-- A-Frame と AR.js を読み込み -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- ARシーンの構築：バーコードマーカー（3x3）を認識する設定に変更 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

      <!-- ID:0 のマーカー（＋電荷用） -->
      <a-marker type="barcode" value="0" id="marker-plus">
        <a-sphere radius="0.3" color="#FF0000" opacity="0.8"></a-sphere>
      </a-marker>

      <!-- ID:1 のマーカー（－電荷用） -->
      <a-marker type="barcode" value="1" id="marker-minus">
        <a-sphere radius="0.3" color="#0000FF" opacity="0.8"></a-sphere>
      </a-marker>

      <!-- ID:2 のマーカー（テスト電荷の発射台用） -->
      <a-marker type="barcode" value="2" id="marker-launcher">
        <!-- 向きが分かるように、円柱と矢印（円錐）を組み合わせる -->
        <a-cylinder radius="0.4" height="0.1" color="#00FF00" opacity="0.5"></a-cylinder>
        <a-cone radius-bottom="0.1" height="0.3" color="#00FF00" position="0 0.2 -0.3" rotation="90 0 0"></a-cone>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
