<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
      body { margin: 0; background: #000; color: white; text-align: center; font-family: sans-serif; }
      #video { width: 100vw; height: 60vh; object-fit: cover; }
      #result { font-size: 2rem; font-weight: bold; color: #00ffcc; margin-top: 10px; min-height: 2.5rem; }
      #status { font-size: 0.8rem; color: #aaa; padding: 10px; }
    </style>
  </head>
  <body>
    <!-- カメラ映像 -->
    <video id="video" autoplay playsinline muted></video>
    
    <!-- 検出結果を表示する場所 -->
    <div id="result"></div>
    <div id="status">カメラとライブラリを準備中...</div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const resultDiv = document.getElementById('result');
      const statusDiv = document.getElementById('status');
      let worker = null;

      // 初期化処理
      async function init() {
        try {
          // 1. カメラの起動
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          video.srcObject = stream;
          statusDiv.innerText = 'カメラ接続完了。OCRライブラリを読み込み中...';

          // 2. Tesseractの準備
          worker = await Tesseract.createWorker('eng');
          statusDiv.innerText = '準備完了！「ABC」の文字をカメラにかざしてください。';

          // 3. 定期的に解析
          setInterval(detect, 2000);
        } catch (err) {
          statusDiv.innerText = 'エラーが発生しました: ' + err.message;
        }
      }

      // 文字認識処理
      async function detect() {
        if (!worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const { data: { text } } = await worker.recognize(canvas);
        
        statusDiv.innerText = `読み取り結果: "${text.trim().replace(/\n/g, ' ')}"`;

        if (text.toUpperCase().includes('ABC')) {
          resultDiv.innerText = 'Hello World!';
        } else {
          resultDiv.innerText = '';
        }
      }

      init();
    </script>
  </body>
</html>
