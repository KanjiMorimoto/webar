<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR物理実験室 - 点電荷</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // マーカー追従用のスムージングコンポーネント
    AFRAME.registerComponent('smooth-follower', {
      schema: {
        target: {type: 'selector'},
        lerpAmount: {type: 'number', default: 0.15}
      },
      init: function() {
        this.targetWorldPos = new THREE.Vector3();
        this.targetWorldQuat = new THREE.Quaternion();
        this.el.object3D.visible = false;
      },
      tick: function () {
        if (!this.data.target) return;
        const targetEl = this.data.target;

        if (targetEl.object3D.visible) {
          this.el.object3D.visible = true;
          targetEl.object3D.getWorldPosition(this.targetWorldPos);
          targetEl.object3D.getWorldQuaternion(this.targetWorldQuat);
          this.el.object3D.position.lerp(this.targetWorldPos, this.data.lerpAmount);
          this.el.object3D.quaternion.slerp(this.targetWorldQuat, this.data.lerpAmount);
        } else {
          this.el.object3D.visible = false;
        }
      }
    });

    // 点電荷コンポーネント (動的更新に対応)
    AFRAME.registerComponent('point-charge-field', {
      schema: {
        charge: {type: 'number', default: 1.0} // 電気量の大きさと符号
      },
      init: function () {
        // 矢印をまとめるグループを作成
        this.arrowGroup = new THREE.Group();
        this.el.object3D.add(this.arrowGroup);
      },
      update: function () {
        // 古い矢印をクリア
        while (this.arrowGroup.children.length > 0) {
          this.arrowGroup.remove(this.arrowGroup.children[0]);
        }

        const chargeValue = this.data.charge;
        if (chargeValue === 0) return; // 電荷0の場合は描画しない

        const chargePos = new THREE.Vector3(0, 1.0, 0);
        const coulombK = Math.abs(chargeValue); // 大きさ
        const sign = Math.sign(chargeValue);    // 符号 (正なら1, 負なら-1)

        const rMin = 0.5, rMax = 2.0, rSteps = 3;
        const thetaSteps = 6, phiSteps = 12;  

        for (let i = 0; i <= rSteps; i++) {
          const r = rMin + (rMax - rMin) * (i / rSteps);
          for (let j = 0; j <= thetaSteps; j++) {
            const theta = Math.PI * (j / thetaSteps);
            const currentPhiSteps = (j === 0 || j === thetaSteps) ? 1 : phiSteps;

            for (let phiIndex = 0; phiIndex < currentPhiSteps; phiIndex++) {
              const phi = (Math.PI * 2) * (phiIndex / currentPhiSteps);
              const x = r * Math.sin(theta) * Math.cos(phi);
              const y = r * Math.cos(theta);
              const z = r * Math.sin(theta) * Math.sin(phi);

              const targetPos = new THREE.Vector3(x, y, z).add(chargePos);
              if (targetPos.y < 0) continue;

              const direction = new THREE.Vector3().subVectors(targetPos, chargePos);
              const distance = direction.length();
              direction.normalize();
              
              // 負電荷の場合はベクトルの向きを逆にする
              if (sign < 0) direction.negate();

              const magnitude = coulombK / (distance * distance);
              const arrowLength = Math.min(magnitude * 0.5, 0.4);
              // 電荷量が大きいほど色も濃くなるように調整
              const colorIntensity = Math.min(magnitude, 1.0);
              const color = new THREE.Color().setHSL((1.0 - colorIntensity) * 0.66, 1.0, 0.5);

              const arrow = new THREE.ArrowHelper(direction, targetPos, arrowLength, color.getHex(), arrowLength * 0.3, arrowLength * 0.3);
              this.arrowGroup.add(arrow);
            }
          }
        }
      }
    });

    // UI(スライダー)とA-Frameの連動処理
    document.addEventListener('DOMContentLoaded', () => {
      const slider = document.getElementById('charge-slider');
      const label = document.getElementById('charge-value-label');
      const fieldEntity = document.getElementById('electric-field');
      const sphereEntity = document.getElementById('charge-sphere');

      slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        
        // ラベルの更新
        label.textContent = val.toFixed(1);

        // 電場ベクトルの更新
        fieldEntity.setAttribute('point-charge-field', 'charge', val);

        // 中心球の色の更新 (正電荷: 赤系, 負電荷: 青系, 0: グレー)
        if (val > 0) {
          sphereEntity.setAttribute('color', '#FF3333');
        } else if (val < 0) {
          sphereEntity.setAttribute('color', '#3333FF');
        } else {
          sphereEntity.setAttribute('color', '#888888');
        }
      });
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">
  
  <!-- タイトルラベル -->
  <div style="position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; z-index: 10; pointer-events: none;">
    <div style="padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: rgba(0, 0, 0, 0.7); color: white; border: 1px solid white; border-radius: 8px;">
      点電荷の電場
    </div>
  </div>

  <!-- スライダーUI -->
  <div style="position: absolute; bottom: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10;">
    <div style="color: white; font-size: 18px; font-weight: bold; margin-bottom: 10px; text-shadow: 1px 1px 3px black;">
      電気量: <span id="charge-value-label">1.0</span>
    </div>
    <!-- min, maxでマイナスからプラスまで変化できるように設定 -->
    <input type="range" id="charge-slider" min="-3.0" max="3.0" step="0.1" value="1.0" style="width: 70%; max-width: 400px; height: 30px;">
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <a-marker id="marker-0" type="barcode" value="0" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"></a-marker>

    <a-entity camera></a-entity>

    <a-entity id="physics-container" smooth-follower="target: #marker-0; lerpAmount: 0.15">
      <!-- スクリプトから操作できるように id を付与 -->
      <a-sphere id="charge-sphere" position="0 1.0 0" radius="0.1" color="#FF3333" opacity="0.9"></a-sphere>
      <a-entity id="electric-field" point-charge-field="charge: 1.0"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
